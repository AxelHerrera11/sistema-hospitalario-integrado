<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="940" viewBox="0 0 1160 940">
  <title>Actividad - Evaluacion NativePHP</title>
  <rect width="1160" height="940" fill="#ffffff"/>
  <text x="580" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2a44">Actividad - evaluacion y prototipo NativePHP</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#1f2a44" stroke-width="1.4"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2a44" stroke="#1f2a44" stroke-width="1.2">
    <circle cx="580" cy="70" r="12" fill="#1f2a44"/>
    <rect x="420" y="105" width="320" height="48" rx="4" fill="#eef3fb" stroke="#2b4c7e"/><text x="580" y="134" text-anchor="middle" stroke="none">Seleccionar flujo HIS acotado</text>
    <rect x="420" y="185" width="320" height="48" rx="4" fill="#eef3fb" stroke="#2b4c7e"/><text x="580" y="214" text-anchor="middle" stroke="none">Definir criterios de viabilidad</text>
    <polygon points="580,270 720,340 580,410 440,340" fill="#fff8e1" stroke="#8a6d00"/><text x="580" y="337" text-anchor="middle" stroke="none">Entorno cumple</text><text x="580" y="355" text-anchor="middle" stroke="none">prerequisitos?</text>
    <rect x="800" y="316" width="230" height="48" rx="4" fill="#fff8e1" stroke="#8a6d00"/><text x="915" y="345" text-anchor="middle" stroke="none">Documentar bloqueo</text>
    <rect x="420" y="445" width="320" height="48" rx="4" fill="#eef3fb" stroke="#2b4c7e"/><text x="580" y="474" text-anchor="middle" stroke="none">Configurar prototipo o simulacion</text>
    <rect x="420" y="535" width="320" height="48" rx="4" fill="#eef3fb" stroke="#2b4c7e"/><text x="580" y="564" text-anchor="middle" stroke="none">Ejecutar flujo con datos ficticios</text>
    <polygon points="580,620 720,690 580,760 440,690" fill="#fff8e1" stroke="#8a6d00"/><text x="580" y="687" text-anchor="middle" stroke="none">Riesgos aceptables?</text>
    <rect x="800" y="666" width="230" height="48" rx="4" fill="#fff8e1" stroke="#8a6d00"/><text x="915" y="695" text-anchor="middle" stroke="none">No recomendado</text>
    <rect x="405" y="800" width="350" height="48" rx="4" fill="#e6f4ea" stroke="#2e7d32"/><text x="580" y="829" text-anchor="middle" stroke="none" fill="#1b5e20">Viable o viable con restricciones</text>
  </g>
  <g stroke="#1f2a44" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="580" y1="82" x2="580" y2="105"/><line x1="580" y1="153" x2="580" y2="185"/><line x1="580" y1="233" x2="580" y2="270"/><line x1="720" y1="340" x2="800" y2="340"/><line x1="580" y1="410" x2="580" y2="445"/><line x1="915" y1="364" x2="740" y2="445"/><line x1="580" y1="493" x2="580" y2="535"/><line x1="580" y1="583" x2="580" y2="620"/><line x1="720" y1="690" x2="800" y2="690"/><line x1="580" y1="760" x2="580" y2="800"/>
  </g>
