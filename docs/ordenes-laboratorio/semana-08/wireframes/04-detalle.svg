  <text x="708" y="432" font-family="system-ui" font-size="12" fill="#b91c1c">Cancelar orden</text>
  <text x="628" y="470" font-family="system-ui" font-size="10" fill="#64748b">Solo si el rol y el estado lo permiten.</text>
  <text x="628" y="486" font-family="system-ui" font-size="10" fill="#64748b">Cancelar exige motivo y no borra el historial.</text>

  <rect x="24" y="438" width="560" height="152" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="464" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">Trazabilidad</text>
  <text x="44" y="488" font-family="system-ui" font-size="11" fill="#475569">Cada evento guarda estado anterior, nuevo, actor, fecha,</text>
  <text x="44" y="506" font-family="system-ui" font-size="11" fill="#475569">motivo (si aplica) y correlation_id. El historial no se edita.</text>
  <text x="44" y="536" font-family="system-ui" font-size="11" fill="#64748b">ID de correlación: a1b2c3d4</text>
  <rect x="44" y="548" width="150" height="26" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="58" y="566" font-family="system-ui" font-size="11" fill="#334155">Copiar enlace</text>

  <rect x="24" y="618" width="912" height="64" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="40" y="640" font-family="system-ui" font-size="11" font-weight="700" fill="#92400e">ANOTACIONES</text>
  <text x="40" y="658" font-family="system-ui" font-size="11" fill="#78350f">A. Estado con texto e icono. B. Historial con actor, hora y correlación. C. Cancelar solo si el estado lo permite y siempre con motivo. D. Acciones por rol, no por URL.</text>
</svg>
