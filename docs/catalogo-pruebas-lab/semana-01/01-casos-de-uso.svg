<text x="245" y="768" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">Línea continua: asociación actor–caso de uso.  <tspan fill="#2e7d32">«include»</tspan>: comportamiento obligatorio reutilizado.  <tspan fill="#b26a00">«extend»</tspan>: comportamiento condicional sobre el caso base.</text>
<text x="245" y="788" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">UC-LAB-04 extiende a UC-LAB-01 si el código tiene una versión vigente que se solapa, faltan requisitos o los rangos son incoherentes.</text>
<text x="245" y="806" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">Cambiar requisitos o rangos de una prueba vigente = cerrar su vigencia (UC-LAB-07) y registrar una nueva versión: las órdenes ya emitidas conservan la versión con la que se pidieron.</text>
<text x="245" y="824" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">Los umbrales críticos que se definen aquí son los que usa Alertas críticas (ASII-21) para detectar un valor crítico.</text>
</svg>
