-weight="normal" text-anchor="middle" fill="#1f2a44">Revocar rol o</text><text x="410.0" y="350.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">fijar vencimiento</text><ellipse cx="650" cy="250" rx="105" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="650.0" y="237.8" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-RBAC-07</text><text x="650.0" y="254.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Validar privilegio</text><text x="650.0" y="270.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">del asignador</text><ellipse cx="890" cy="150" rx="105" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="890.0" y="137.8" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-RBAC-06</text><text x="890.0" y="154.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Registrar evento</text><text x="890.0" y="170.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">de auditoría</text><ellipse cx="410" cy="500" rx="105" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="410.0" y="487.8" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-RBAC-03</text><text x="410.0" y="504.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Ejecutar operación</text><text x="410.0" y="520.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">protegida</text><ellipse cx="690" cy="500" rx="118" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="690.0" y="487.8" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-RBAC-04</text><text x="690.0" y="504.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Autorizar operación</text><text x="690.0" y="520.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">(token, tenant, rol, permiso)</text><ellipse cx="890" cy="420" rx="105" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="890.0" y="407.8" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-RBAC-05</text><text x="890.0" y="424.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Denegar operación</text><text x="890.0" y="440.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">con traza</text><ellipse cx="410" cy="665" rx="105" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="410.0" y="652.8" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-RBAC-08</text><text x="410.0" y="669.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Consultar permisos</text><text x="410.0" y="685.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">efectivos (menú/rutas)</text><circle cx="110" cy="110" r="11" fill="white" stroke="#1f2a44" stroke-width="1.6"/><line x1="110" y1="121" x2="110" y2="154" stroke="#1f2a44" stroke-width="1.6"/><line x1="90" y1="132" x2="130" y2="132" stroke="#1f2a44" stroke-width="1.6"/><line x1="110" y1="154