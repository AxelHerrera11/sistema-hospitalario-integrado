    <circle cx="1090" cy="595" r="11" fill="#fff"/><line x1="1090" y1="606" x2="1090" y2="642"/><line x1="1067" y1="618" x2="1113" y2="618"/><line x1="1090" y1="642" x2="1073" y2="672"/><line x1="1090" y1="642" x2="1107" y2="672"/><text x="1090" y="698" font-size="13" font-weight="700" text-anchor="middle" stroke="none">Medico solicitante</text>
  </g>
  <g stroke="#1f2a44" stroke-width="1.3" fill="none">
    <line x1="150" y1="315" x2="305" y2="170"/><line x1="150" y1="325" x2="305" y2="275"/><line x1="150" y1="335" x2="575" y2="385"/><line x1="150" y1="585" x2="575" y2="500"/><line x1="1048" y1="610" x2="965" y2="610"/>
