  <rect x="250" y="700" width="730" height="46" fill="#fff8d6" stroke="#8a7a2a"/>
  <text x="265" y="728" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2a44">Fuera de alcance: recepcion de muestras, catalogo de pruebas, validacion final por bioquimico y alertas criticas.</text>
