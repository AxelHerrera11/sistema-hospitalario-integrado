name: ASII PR Guard

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-pr:
    name: Validate ASII PR
    runs-on: ubuntu-latest
    env:
      # Untrusted PR data is passed through env vars, never interpolated into the script.
      PR_BODY: ${{ github.event.pull_request.body }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      # Teacher and this group's integration lead.
      MAIN_INTEGRATORS: "rortizs Yamilet1235"
    steps:
      - name: Ensure PR has a useful description
        run: |
          if [ "${#PR_BODY}" -lt 80 ]; then
            echo "ERROR: completá la plantilla del PR con evidencia del módulo."
            exit 1
          fi

      - name: Ensure branch naming follows ASII workflow
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "develop" ]; then
            echo "Integration PR develop -> main"
            exit 0
          fi
          if printf '%s\n' "$HEAD_REF" | grep -qE '^(feature|fix|docs|test|chore|refactor)/asii-[0-9]{2}-[a-z0-9._-]+$'; then
            echo "Branch name OK: $HEAD_REF"
          else
            echo "ERROR: usá ramas tipo feature/asii-03-pacientes-glendi20"
            exit 1
          fi

      - name: Restrict PRs to main to the group integration lead
        if: github.base_ref == 'main'
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "ERROR: a main solo se integra desde develop."
            exit 1
          fi
          if printf '%s\n' $MAIN_INTEGRATORS | grep -qixF -- "$PR_AUTHOR"; then
            echo "Integration to main allowed: $PR_AUTHOR"
          else
            echo "ERROR: solo el responsable de integración del grupo puede abrir PR a main; los PR de estudiantes van a develop."
            exit 1
          fi
