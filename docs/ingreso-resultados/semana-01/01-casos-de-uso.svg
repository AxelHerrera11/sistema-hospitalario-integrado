<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="780" viewBox="0 0 1220 780">
  <title>Casos de uso - Ingreso de resultados de laboratorio</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1f2a44" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1220" height="780" fill="#ffffff"/>
  <text x="610" y="34" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2a44">Casos de uso - Captura y correccion controlada de resultados pendientes</text>
  <rect x="250" y="70" width="730" height="610" rx="6" fill="#fbfcfe" stroke="#1f2a44" stroke-width="1.6"/>
