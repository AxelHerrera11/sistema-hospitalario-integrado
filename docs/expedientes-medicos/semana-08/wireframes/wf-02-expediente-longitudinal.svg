<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>WF-02 Expediente longitudinal (carga y éxito)</title>
  <rect width="900" height="560" fill="#fff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">WF-02 · Carga → expediente longitudinal (éxito)</text>
  <rect x="20" y="44" width="600" height="36" fill="#eee" stroke="#999" stroke-dasharray="4 3"/>
  <text x="32" y="67">Cargando… «Consultando el expediente.» (botones deshabilitados, aria-busy)</text>
  <rect x="20" y="90" width="600" height="440" fill="#f7f7f7" stroke="#555"/>
  <rect x="32" y="100" width="576" height="40" fill="#e3e3e3" stroke="#555"/>
  <text x="44" y="125" font-weight="bold">Expediente longitudinal · 3 episodio(s) registrados</text>
  <g font-size="12">
    <text x="44" y="162" fill="#555">Paciente</text><text x="44" y="178" font-weight="bold">Nombre Apellido</text>
    <text x="230" y="162" fill="#555">Código</text><text x="230" y="178" font-weight="bold">P-0001</text>
    <text x="400" y="162" fill="#555">Expediente</text><text x="400" y="178" font-weight="bold">EXP-P-0001 · Abierto</text>
    <text x="44" y="200" fill="#555">Nacimiento · Sexo · Estado del paciente · Abierto el</text>
  </g>
  <rect x="44" y="212" width="90" height="22" rx="11" fill="#e3e3e3"/><text x="54" y="227" font-size="12">3 episodio(s)</text>
  <rect x="142" y="212" width="86" height="22" rx="11" fill="#e3e3e3"/><text x="152" y="227" font-size="12">1 abierto(s)</text>
  <text x="44" y="258" font-weight="bold">Episodios clínicos (más reciente primero)</text>
  <rect x="44" y="268" width="552" height="70" fill="#fff" stroke="#555"/>
  <text x="56" y="288" font-weight="bold">Hospitalización [Abierto]</text><text x="56" y="306" font-size="12">Desde 20/10/2026 · Servicio MED-INT</text>
  <text x="56" y="326" font-size="12" fill="#333">▸ Motivo de atención (plegado)</text>
  <rect x="44" y="346" width="552" height="70" fill="#fff" stroke="#555"/>
  <text x="56" y="366" font-weight="bold">Emergencia [Cerrado]</text><text x="56" y="384" font-size="12">14/07/2026 – 15/07/2026 · Servicio EMERG</text>
  <text x="56" y="404" font-size="12" fill="#333">▸ Motivo de atención (plegado)</text>
  <rect x="44" y="424" width="552" height="40" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="56" y="449" font-size="12">… episodios anteriores</text>
  <rect x="44" y="476" width="200" height="30" fill="#fff" stroke="#555"/><text x="56" y="496">Ocultar datos del paciente</text>
  <g fill="#c62828" font-weight="bold" font-size="12">
    <circle cx="612" cy="62" r="10"/><text x="608" y="66" fill="#fff">1</text>
    <circle cx="612" cy="170" r="10"/><text x="608" y="174" fill="#fff">2</text>
    <circle cx="612" cy="300" r="10"/><text x="608" y="304" fill="#fff">3</text>
    <circle cx="612" cy="326" r="10"/><text x="608" y="330" fill="#fff">4</text>
    <circle cx="256" cy="491" r="10"/><text x="252" y="495" fill="#fff">5</text>
  </g>
  <g font-size="12">
    <text x="640" y="110" font-weight="bold">Anotaciones</text>
    <text x="640" y="134">1 Estado de carga con texto (no solo spinner).</text>
    <text x="640" y="158">2 Ficha mínima: sin contacto ni global_id;</text>
    <text x="652" y="174">sexo y estado en español.</text>
    <text x="640" y="198">3 Línea de tiempo del más reciente al</text>
    <text x="652" y="214">más antiguo; estado como texto + insignia.</text>
    <text x="640" y="238">4 Dato sensible plegado: se ve solo si</text>
    <text x="652" y="254">quien consulta lo despliega.</text>
    <text x="640" y="278">5 Quita los datos de la pantalla y devuelve</text>
    <text x="652" y="294">el foco al campo de código.</text>
    <text x="640" y="326">Foco: al terminar, va al título «Resultado».</text>
    <text x="640" y="350">Expediente sin episodios = estado vacío.</text>
  </g>
</svg>
