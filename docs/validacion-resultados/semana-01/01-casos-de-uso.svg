    <ellipse cx="430" cy="275" rx="125" ry="35" fill="#eef3fb"/><text x="430" y="265" font-size="12" font-weight="700" text-anchor="middle" fill="#2b4c7e" stroke="none">UC-VAL-02</text><text x="430" y="285" font-size="13" text-anchor="middle" stroke="none">Revisar resultado</text>
    <ellipse cx="700" cy="275" rx="125" ry="35" fill="#eef3fb"/><text x="700" y="265" font-size="12" font-weight="700" text-anchor="middle" fill="#2b4c7e" stroke="none">UC-VAL-03</text><text x="700" y="285" font-size="13" text-anchor="middle" stroke="none">Validar coherencia</text>
    <ellipse cx="700" cy="385" rx="125" ry="35" fill="#eef3fb"/><text x="700" y="375" font-size="12" font-weight="700" text-anchor="middle" fill="#2b4c7e" stroke="none">UC-VAL-04</text><text x="700" y="395" font-size="13" text-anchor="middle" stroke="none">Aprobar resultado</text>
    <ellipse cx="430" cy="500" rx="125" ry="35" fill="#eef3fb"/><text x="430" y="490" font-size="12" font-weight="700" text-anchor="middle" fill="#2b4c7e" stroke="none">UC-VAL-05</text><text x="430" y="510" font-size="13" text-anchor="middle" stroke="none">Rechazar resultado</text>
    <ellipse cx="700" cy="500" rx="125" ry="35" fill="#eef3fb"/><text x="700" y="490" font-size="12" font-weight="700" text-anchor="middle" fill="#2b4c7e" stroke="none">UC-VAL-06</text><text x="700" y="510" font-size="13" text-anchor="middle" stroke="none">Devolver correccion</text>
    <ellipse cx="700" cy="610" rx="125" ry="35" fill="#eef3fb"/><text x="700" y="600" font-size="12" font-weight="700" text-anchor="middle" fill="#2b4c7e" stroke="none">UC-VAL-07</text><text x="700" y="620" font-size="13" text-anchor="middle" stroke="none">Auditar decision</text>
    <ellipse cx="880" cy="610" rx="85" ry="30" fill="#eef3fb"/><text x="880" y="615" font-size="12" text-anchor="middle" stroke="none">UC-VAL-08</text>
