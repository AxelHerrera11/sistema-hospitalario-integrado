"normal" text-anchor="middle" fill="#1f2a44">y alertas</text><ellipse cx="700" cy="135" rx="110" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="700.0" y="123.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-03</text><text x="700.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Rechazar medición</text><text x="700.0" y="156.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">no plausible</text><ellipse cx="700" cy="268" rx="110" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="700.0" y="256.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-02</text><text x="700.0" y="273.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Evaluar umbrales</text><text x="700.0" y="289.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">clínicos</text><ellipse cx="920" cy="350" rx="108" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="920.0" y="338.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-04</text><text x="920.0" y="355.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Generar alerta</text><text x="920.0" y="371.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">clínica</text><ellipse cx="920" cy="480" rx="108" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="920.0" y="468.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-05</text><text x="920.0" y="485.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Notificar alerta a</text><text x="920.0" y="501.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">médicos tratantes</text><ellipse cx="720" cy="578" rx="108" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="720.0" y="566.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-08</text><text x="720.0" y="583.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Registrar evento</text><text x="720.0" y="599.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">de auditoría</text><ellipse cx="700" cy="712" rx="112" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="700.0" y="700.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-07</text><text x="700.0" y="717.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Validar acceso y</text><text x="700.0" y="733.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">médico tratante</text><line x1="142.0" y1="480.0" x2="352.0" y2="232.9" stroke="#1f2a44" stroke-width="1.3" fill="none"/><line x1="142.0" y1="480.0" x2="271.0" y2="474.6" stroke="#1f2a44" stroke-width="1.3" fill="none"/><line x1="142.0" y1="480.0" x2="347.1" y2="682.5" stroke="#1f2a44" stroke-width="1.3" fill="none"/><circle cx="110" cy="440" r="11" fill="white" stroke="#1f2a44" stroke-width="1.6"/><line x1="110" y1="451" x2="110" y2="484" stroke="#1f2a44" stroke-width="1.6"/><line x1="90" y1="462" x2="130" y2="462" stroke="#1f2a44" stroke-width="1.6"/><line x1="110" y1="484" x2="95" y2="508" stroke="#1f2a44" stroke-width="1.6"/><line x1="110" y1="484" x2="125" y2="508" stroke="#1f2a44" stroke-width="1.6"/><text x="110.0" y="530.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2a44">Médico tratante</text><text x="110.0" y="546.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2a44">(asignación activa)</text><line x1="489.9" y1="198.5" x2="1053" y2="191.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><rect x="1055" y="162" width="170" height="58" fill="#f6f6f6" stroke="#1f2a44" stroke-width="1.4"/><text x="1140.0" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1140.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">Expediente médico</text><text x="1140.0" y="211.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">(episodio y expediente)</text><line x1="810.0" y1="268.0" x2="1053" y2="268.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><rect x="1055" y="239" width="170" height="58" fill="#f6f6f6" stroke="#1f2a44" stroke-width="1.4"/><text x="1140.0" y="260.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1140.0" y="273.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">Perfil de umbrales</text><text x="1140.0" y="288.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">(configuración versionada)</text><line x1="1028.0" y1="480.0" x2="1053" y2="480.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><rect x="1055" y="451" width="170" height="58" fill="#f6f6f6" stroke="#1f2a44" stroke-width="1.4"/><text x="1140.0" y="472.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1140.0" y="485.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">Servicio de</text><text x="1140.0" y="500.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">notificaciones</text><line x1="820.7" y1="590.3" x2="1053" y2="619.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><rect x="1055" y="590" width="170" height="58" fill="#f6f6f6" stroke="#1f2a44" stroke-width="1.4"/><text x="1140.0" y="611.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1140.0" y="624.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">Bitácora de</text><text x="1140.0" y="639.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">auditoría</text><line x1="810.6" y1="717.3" x2="1053" y2="729.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><rect x="1055" y="700" width="170" height="58" fill="#f6f6f6" stroke="#1f2a44" stroke-width="1.4"/><text x="1140.0" y="721.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1140.0" y="734.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">RBAC</text><text x="1140.0" y="749.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">(roles y permisos)</text><path d="M240,812 L1028,812 L1040,824 L1040,940 L240,940 Z" fill="#fff8d6" stroke="#8a7a2a" stroke-width="1.1"/><text x="250.0" y="832.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Regla: solo un médico con care_assignment activo en el episodio registra signos vitales (trigger de autoría) y reconoce sus alertas.</text><text x="250.0" y="853.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Rangos de plausibilidad (CHECK de vital_signs) ≠ umbrales clínicos: lo imposible se rechaza; lo anormal se guarda y genera alerta.</text><text x="250.0" y="874.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Un signo vital validado es inmutable y no se borra. No existe valor anormal sin alerta: signo, alerta y auditoría van en una transacción.</text><text x="250.0" y="895.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">La notificación es asíncrona tras el COMMIT; si falla, se reintenta y la alerta sigue abierta en la bandeja del médico.</text><text x="250.0" y="916.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Fuera de alcance: captura por enfermería o dispositivos, escalamiento automático, canales externos (SMS/correo) y umbrales pediátricos.</text><rect x="508.6" y="217.0" width="62.9" height="17" fill="white" opacity="0.92"/><text x="540.0" y="230.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="398.4" y="140.5" width="203.2" height="17" fill="white" opacity="0.92"/><text x="500.0" y="153.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«extend» [medición no plausible]</text><rect x="788.7" y="294.1" width="203.2" height="17" fill="white" opacity="0.92"/><text x="890.3" y="307.1" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«extend» [valor fuera de umbral]</text><rect x="924.5" y="402.0" width="62.9" height="17" fill="white" opacity="0.92"/><text x="956.0" y="415.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="723.7" y="419.5" width="62.9" height="17" fill="white" opacity="0.92"/><text x="755.1" y="432.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="518.9" y="505.1" width="62.9" height="17" fill="white" opacity="0.92"/><text x="550.3" y="518.1" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="457.9" y="429.5" width="62.9" height="17" fill="white" opacity="0.92"/><text x="489.4" y="442.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="462.7" y="569.0" width="62.9" height="17" fill="white" opacity="0.92"/><text x="494.1" y="582.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="508.6" y="690.5" width="62.9" height="17" fill="white" opacity="0.92"/><text x="540.0" y="703.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text></svg>