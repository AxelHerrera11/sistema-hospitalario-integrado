openapi: 3.0.3
info:
  title: QA, pruebas E2E y CI — ejecuciones y quality gate
  version: 0.1.0
  description: >
    Implementado en micro-his/qa-calidad-versiones (demo y CLI de CI). Los permisos
    qa.* son una PROPUESTA pendiente de aprobación en RBAC (no están en config/rbac.php).
servers:
  - url: http://127.0.0.1:8093
    description: Servidor de demostración aislado (datos ficticios)
paths:
  /api/v1/qa/runs:
    get:
      summary: Listar ejecuciones del tenant
      description: 'Permiso propuesto: qa.ejecuciones.ver'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Run' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Planificar ejecución
      description: 'Permiso propuesto: qa.ejecuciones.registrar'
      parameters: [ { $ref: '#/components/parameters/TenantId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanRequest' } } } }
      responses:
        '201': { description: Planificada, content: { application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/qa/runs/{id}:
    get:
      summary: Detalle con la última decisión
      description: 'Permiso propuesto: qa.ejecuciones.ver'
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/RunId' } ]
      responses:
        '200': { description: Detalle, content: { application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/qa/runs/{id}/transitions:
    post:
      summary: start | complete | abort
      description: 'Permiso propuesto: qa.ejecuciones.registrar'
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/RunId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [transition], properties: { transition: { type: string, enum: [start, complete, abort] }, reason: { type: string, maxLength: 200 } } } } }
      responses:
        '200': { description: Nuevo estado, content: { application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/qa/runs/{id}/results:
    post:
      summary: Registrar resultado de una suite
      description: 'Permiso propuesto: qa.ejecuciones.registrar'
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/RunId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResultRequest' } } } }
      responses:
        '201': { description: Registrado, content: { application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/qa/runs/{id}/gate-decisions:
    post:
      summary: Evaluar el quality gate
      description: 'Permiso propuesto: qa.gates.evaluar'
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/RunId' } ]
      responses:
        '201': { description: Decisión, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Decision' } } } } } }
        default: { $ref: '#/components/responses/Error' }
components:
  parameters:
    TenantId: { name: X-Tenant-ID, in: header, required: true, schema: { type: string } }
    RunId: { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' } }
  responses:
    Error:
      description: '400, 401, 403, 404, 409, 413, 422, 500 o 503'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, trace_id]
      properties: { code: { type: string }, trace_id: { type: string }, reason: { type: string }, message: { type: string } }
    PlanRequest:
      type: object
      required: [release_version, commit_sha, environment, suites]
      properties:
        release_version: { type: string, pattern: '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$' }
        commit_sha: { type: string, pattern: '^[0-9a-f]{40}$' }
        environment: { type: string, enum: [local, ci, staging] }
        suites:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [name, kind]
            properties:
              name: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,62}$' }
              kind: { type: string, enum: [syntax, lint, static_analysis, build, unit, integration, contract, e2e] }
              required: { type: boolean, default: true }
    Evidence:
      type: object
      required: [kind, path, sha256, bytes]
      properties:
        kind: { type: string, enum: [junit, log, screenshot, summary] }
        path: { type: string, maxLength: 200 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        bytes: { type: integer, minimum: 1 }
    ResultRequest:
      type: object
      required: [suite, total, failed, skipped, duration_ms]
      properties:
        suite: { type: string }
        total: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        evidence: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Evidence' } }
    Finding:
      type: object
      properties:
        rule: { type: string }
        severity: { type: string, enum: [blocker, rejection, warning] }
        suite: { type: string, nullable: true }
        detail: { type: string }
    Decision:
      type: object
      properties:
        run_id: { type: string }
        verdict: { type: string, enum: [approved, rejected, blocked] }
        policy_version: { type: string }
        evaluated_by: { type: string }
        evaluated_at: { type: string, format: date-time }
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
    Run:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        release_version: { type: string }
        commit_sha: { type: string }
        environment: { type: string }
        status: { type: string, enum: [planned, running, completed, aborted] }
        created_by: { type: string }
        created_at: { type: string }
        finished_at: { type: string, nullable: true }
        abort_reason: { type: string, nullable: true }
        suites: { type: array, items: { type: object } }
        gate: { allOf: [ { $ref: '#/components/schemas/Decision' } ], nullable: true }
    RunEnvelope:
      type: object
      properties: { data: { $ref: '#/components/schemas/Run' } }
