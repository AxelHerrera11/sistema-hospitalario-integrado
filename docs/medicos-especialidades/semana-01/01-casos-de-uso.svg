44" stroke-width="1.4"/><text x="1185.0" y="811.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1185.0" y="824.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">Citas médicas</text><text x="1185.0" y="839.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">(appointments, lectura)</text><path d="M250,858 L1068,858 L1080,870 L1080,1010 L250,1010 Z" fill="#fff8d6" stroke="#8a7a2a" stroke-width="1.1"/><text x="262.0" y="880.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Registro: la cuenta ya existe (CENTRAL → local_user_refs con rol Medico); el módulo crea el perfil profesional, no el usuario.</text><text x="262.0" y="901.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Licencia única y un solo perfil activo abierto por usuario. El alta exige especialidad principal, en la misma transacción.</text><text x="262.0" y="922.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Asociación: sin periodos solapados de la misma especialidad ni dos principales a la vez (EXCLUDE de doctor_specialties).</text><text x="262.0" y="943.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Disponibilidad = horario de atención − citas activas (scheduled / confirmed) − fechas sin asociación vigente. Solo lectura.</text><text x="262.0" y="964.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">La reserva no es de este módulo: la restricción EXCLUDE de appointments (módulo Citas) evita la doble reserva.</text><text x="262.0" y="985.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Fuera de alcance: crear cuentas, mantener el catálogo, cambiar la principal, reservar citas y ausencias del médico.</text><rect x="332.6" y="282.0" width="62.9" height="17" fill="white" opacity="0.92"/><text x="364.0" y="295.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="466.0" y="147.3" width="239.8" height="17" fill="white" opacity="0.92"/><text x="585.9" y="160.3" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«extend» [licencia o perfil duplicado]</text><rect x="472.8" y="256.0" width="270.3" height="17" fill="white" opacity="0.92"/><text x="607.9" y="269.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«extend» [periodo solapado o 2.ª principal]</text><rect x="527.0" y="431.7" width="62.9" height="17" fill="white" opacity="0.92"/><text x="558.5" y="444.7" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="478.7" y="590.6" width="62.9" height="17" fill="white" opacity="0.92"/><text x="510.1" y="603.6" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="531.4" y="713.7" width="62.9" height="17" fill="white" opacity="0.92"/><text x="562.8" y="726.7" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="744.2" y="250.1" width="62.9" height="17" fill="white" opacity="0.92"/><text x="775.7" y="263.1" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="744.0" y="312.7" width="62.9" height="17" fill="white" opacity="0.92"/><text x="775.4" y="325.7" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="781.8" y="380.2" width="62.9" height="17" fill="white" opacity="0.92"/><text x="813.2" y="393.2" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="761.2" y="447.1" width="62.9" height="17" fill="white" opacity="0.92"/><text x="792.6" y="460.1" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="756.0" y="540.8" width="62.9" height="17" fill="white" opacity="0.92"/><text x="787.4" y="553.8" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text></svg>