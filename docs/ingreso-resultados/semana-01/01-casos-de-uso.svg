  <g stroke="#1f2a44" stroke-width="1.3" fill="none">
    <line x1="150" y1="205" x2="335" y2="174"/>
    <line x1="150" y1="215" x2="335" y2="275"/>
    <line x1="150" y1="505" x2="335" y2="498"/>
    <line x1="150" y1="515" x2="575" y2="500"/>
    <line x1="1048" y1="610" x2="825" y2="610"/>
