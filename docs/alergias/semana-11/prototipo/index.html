<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo — Alergias clínicas y alerta visual</title>
<style>
:root{--ink:#1f2a44;--muted:#4a5266;--line:#c9cfdb;--bg:#f6f7fb;--ok:#1b5e20;--okbg:#e6f4ea;--warn:#6b4100;--warnbg:#fff3e0;--err:#8e1c1c;--errbg:#fdecea;--crit:#b71c1c;--grey:#303437;--greybg:#e3e5e8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--ink);color:#fff}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
button{min-height:44px;min-width:44px;padding:10px 16px;border-radius:6px;border:1px solid var(--ink);background:#fff;color:var(--ink);font:inherit;cursor:pointer}
button.primary{background:var(--ink);color:#fff}
button[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
label{display:block;font-weight:600;margin-top:12px}
input,select{width:100%;min-height:44px;padding:8px;font:inherit;border:1px solid var(--muted);border-radius:6px;background:#fff}
fieldset{border:1px solid var(--line);border-radius:6px;margin-top:12px}
.msg{padding:12px;border-radius:6px;margin:12px 0;border-left:6px solid}
.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.warn{background:var(--warnbg);border-color:#b26a00;color:var(--warn)}
.err{background:var(--errbg);border-color:#c62828;color:var(--err)}
.crit{background:var(--crit);border-color:#7f0000;color:#fff}
.grey{background:var(--greybg);border-color:var(--grey);color:var(--grey)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.sim{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:8px;margin-bottom:12px}
.sim button{min-height:36px;padding:4px 10px;font-size:14px}
.sim button[aria-pressed=true]{background:var(--ink);color:#fff}
[role=radio][aria-checked=true]{background:var(--ink);color:#fff;outline:3px solid #ffbf47}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
.sm-only{display:none}
@media (max-width:639px){
 .lg-only{display:none!important} .sm-only{display:block}
 thead{display:none} tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:8px;background:#fff}
 td{display:block;border:0;padding:2px 0}
 .actions{position:sticky;bottom:0;background:var(--bg);padding:8px 0;margin:0} .actions button{flex:1}
}
</style>
</head>
<body>
<header><strong>HIS · Alergias clínicas y alerta visual</strong><span>HOSP-DEMO · medico1 · datos ficticios</span></header>
<main>
<div class="sim" role="group" aria-label="Simulador del prototipo">Respuesta simulada del servidor: <button type="button" data-sim="ok" aria-pressed="true">Correcta</button> <button type="button" data-sim="down" aria-pressed="false">Servidor caído</button></div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<section id="expediente" data-screen>
  <h1>Expediente · P-DEMO · 45 años</h1>
  <div id="banner" class="msg" role="alert"></div>
  <div class="card"><p><strong>Resumen:</strong> ingreso por neumonía (datos ficticios).</p>
  <div class="actions"><button type="button" id="reload">Volver a consultar</button><button type="button" class="primary" data-go="registrar">Registrar alergia</button></div></div>
</section>
<section id="registrar" data-screen hidden>
  <h1>Registrar alergia</h1>
  <form id="alta" class="card" novalidate>
    <label for="allergen">Alérgeno *</label><input id="allergen" value="Penicilina" aria-describedby="alta-msg">
    <fieldset><legend>Tipo *</legend>
      <label><input type="radio" name="type" value="allergy" checked style="width:auto;min-height:auto"> Alergia</label>
      <label><input type="radio" name="type" value="intolerance" style="width:auto;min-height:auto"> Intolerancia</label>
    </fieldset>
    <label for="severity">Severidad *</label>
    <select id="severity"><option value="life_threatening">Amenaza la vida</option><option value="severe">Grave</option><option value="moderate">Moderada</option><option value="mild">Leve</option></select>
    <label for="reaction">Reacción</label><input id="reaction" value="Anafilaxia">
    <div id="alta-msg" class="msg" hidden></div>
    <div class="actions"><button type="button" data-go="expediente">Cancelar</button><button type="submit" class="primary">Guardar</button></div>
  </form>
</section>
</main>
<script>
const $ = s => document.querySelector(s);
let sim = 'ok';
document.querySelectorAll('[data-sim]').forEach(b => b.addEventListener('click', () => {
  sim = b.dataset.sim;
  document.querySelectorAll('[data-sim]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
function show(id) {
  document.querySelectorAll('section[data-screen]').forEach(s => { s.hidden = s.id !== id; });
  const h = document.querySelector('#' + id + ' h1');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
}
function say(el, cls, text) { el.className = 'msg ' + cls; el.textContent = text; el.hidden = false; }
function announce(text) { $('#live').textContent = text; }
document.addEventListener('click', e => { const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); show(go.dataset.go); } });
let alergias = [];
const textos = {life_threatening: 'amenaza la vida', severe: 'grave', moderate: 'moderada', mild: 'leve'};
function pintarBanner() {
  const b = $('#banner');
  b.textContent = 'Cargando alergias…'; b.className = 'msg grey';
  if (sim === 'down') return say(b, 'grey', 'Alergias no disponibles: verificar con el paciente antes de prescribir.');
  if (!alergias.length) return say(b, 'ok', 'Sin alergias registradas.');
  const graves = alergias.filter(a => a.severity === 'life_threatening' || a.severity === 'severe');
  const lista = alergias.map(a => a.allergen + ' · ' + textos[a.severity] + (a.reaction ? ' · ' + a.reaction : '')).join('; ');
  say(b, graves.length ? 'crit' : 'warn', (graves.length ? 'ALERGIA GRAVE: verificar antes de prescribir. ' : 'Alergias registradas: ') + lista);
}
$('#reload').addEventListener('click', pintarBanner);
document.getElementById('alta').addEventListener('submit', e => {
  e.preventDefault();
  const msg = $('#alta-msg'), allergen = $('#allergen').value.trim();
  if (sim === 'down') return say(msg, 'grey', 'Sin respuesta: la alergia no se guardó. Reintente.');
  if (!allergen) { say(msg, 'err', 'Indique el alérgeno (ALLERGEN_REQUIRED).'); return $('#allergen').focus(); }
  if (alergias.some(a => a.allergen.toLowerCase() === allergen.toLowerCase())) return say(msg, 'warn', 'Ya hay una alergia activa equivalente (ALLERGY_ALREADY_ACTIVE).');
  alergias.push({allergen, severity: $('#severity').value, reaction: $('#reaction').value.trim()});
  announce('Alergia registrada'); msg.hidden = true; show('expediente'); pintarBanner();
});
pintarBanner();
show(location.hash.slice(1) || 'expediente');
</script>
</body>
</html>
