openapi: 3.1.0
info:
  title: Micro-HIS Catálogo de pruebas de laboratorio — API v1
  version: 1.0.0
  description: Alta y consulta de versiones de pruebas (ASII-17). Errores en application/problem+json (RFC 9457) con code y request_id.
  license:
    name: Uso académico
    identifier: CC-BY-4.0
servers:
  - url: http://127.0.0.1:8083
security:
  - userRef: []
paths:
  /api/v1/lab-tests:
    get:
      operationId: findActiveLabTests
      summary: Pruebas vigentes a una fecha (UC-LAB-05)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
        - { name: format, in: query, description: html = View de la Semana 4, schema: { type: string, enum: [html] } }
      responses:
        '200':
          description: Versiones activas con valid_from ≤ fecha
          content:
            application/json:
              schema: { type: object, required: [lab_tests], properties: { lab_tests: { type: array, items: { $ref: '#/components/schemas/LabTestSummary' } } } }
            text/html: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: registerLabTest
      summary: Registrar una versión de prueba (UC-LAB-01 a 04)
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LabTestInput' } } }
      responses:
        '201':
          description: Versión creada
          content: { application/json: { schema: { type: object, required: [lab_test], properties: { lab_test: { type: object } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /health:
    get:
      operationId: liveness
      summary: El proceso responde (solo GET; otro método da 404)
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '404': { $ref: '#/components/responses/Problem' }
  /health/ready:
    get:
      operationId: readiness
      summary: La base responde
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Health' }
components:
  securitySchemes:
    userRef:
      type: apiKey
      in: header
      name: X-User-Ref
      description: Identidad que inyecta el gateway del HIS tras validar el JWT (propuesto para el HIS integrado).
  parameters:
    TenantId: { name: X-Tenant-ID, in: header, required: true, schema: { type: string, example: HOSP-DEMO } }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, code, request_id]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              code: { type: string, examples: [TENANT_REQUIRED, RANGES_INCOHERENT, LAB_TEST_VALIDITY_OVERLAP] }
              field: { type: string }
              request_id: { type: string }
    Health:
      description: Estado del servicio
      content: { application/json: { schema: { type: object, required: [status, service], properties: { status: { type: string, enum: [ok, unavailable] }, service: { type: string } } } } }
  schemas:
    LabTestInput:
      type: object
      required: [code, name, specimen_type, min_volume_ml, result_type, valid_from]
      properties:
        code: { type: string }
        name: { type: string }
        specimen_type: { type: string }
        min_volume_ml: { type: number, exclusiveMinimum: 0 }
        result_type: { type: string, enum: [numeric, qualitative, text] }
        unit: { type: [string, 'null'] }
        reference_low: { type: number }
        reference_high: { type: number }
        critical_low: { type: number }
        critical_high: { type: number }
        valid_from: { type: string, format: date }
    LabTestSummary:
      type: object
      required: [code, name, version_no, valid_from]
      properties:
        code: { type: string }
        name: { type: string }
        unit: { type: [string, 'null'] }
        reference_low: { type: [number, 'null'] }
        reference_high: { type: [number, 'null'] }
        version_no: { type: integer }
        valid_from: { type: string, format: date }
