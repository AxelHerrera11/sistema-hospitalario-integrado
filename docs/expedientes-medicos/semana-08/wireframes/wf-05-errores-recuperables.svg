<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>WF-05 Errores recuperables y validación</title>
  <rect width="900" height="470" fill="#fff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">WF-05 · Errores recuperables, validación y estado vacío</text>
  <rect x="20" y="44" width="290" height="120" fill="#f7f7f7" stroke="#555"/>
  <text x="32" y="66">Código del paciente *</text>
  <rect x="32" y="74" width="266" height="28" fill="#fff" stroke="#333" stroke-width="2.5"/><text x="40" y="93">P 0001</text>
  <text x="32" y="122" font-size="11" font-weight="bold">El código solo admite letras, números, guion</text>
  <text x="32" y="138" font-size="11" font-weight="bold">y guion bajo, con un máximo de 40 caracteres.</text>
  <rect x="330" y="44" width="290" height="150" fill="#f7f7f7" stroke="#555"/>
  <text x="342" y="66" font-weight="bold">Hospital no disponible</text>
  <text x="342" y="86" font-size="12">La base de datos de este hospital no responde.</text>
  <text x="342" y="102" font-size="12">Reintente en unos minutos.</text>
  <text x="342" y="126" font-size="12">Intento 1 de 3.</text>
  <rect x="342" y="140" width="100" height="30" fill="#fff" stroke="#555"/><text x="360" y="160">Reintentar</text>
  <rect x="20" y="210" width="290" height="130" fill="#f7f7f7" stroke="#555"/>
  <text x="32" y="232" font-weight="bold">Datos protegidos</text>
  <text x="32" y="252" font-size="12">Por seguridad no se muestra el expediente:</text>
  <text x="32" y="268" font-size="12">la bitácora de auditoría no respondió.</text>
  <text x="32" y="292" font-size="12">Se agotaron los reintentos. Avise a soporte</text>
  <text x="32" y="308" font-size="12">e indique la hora del error.</text>
  <rect x="330" y="210" width="290" height="130" fill="#eee" stroke="#999" stroke-dasharray="4 3"/>
  <text x="342" y="232" font-weight="bold">Sin expediente abierto</text>
  <text x="342" y="252" font-size="12">El paciente todavía no tiene expediente en</text>
  <text x="342" y="268" font-size="12">este hospital. Si corresponde, solicite su apertura.</text>
  <rect x="342" y="284" width="160" height="30" fill="#fff" stroke="#555"/><text x="356" y="304">Solicitar apertura…</text>
  <g fill="#c62828" font-weight="bold" font-size="12">
    <circle cx="300" cy="88" r="10"/><text x="296" y="92" fill="#fff">1</text>
    <circle cx="610" cy="155" r="10"/><text x="606" y="159" fill="#fff">2</text>
    <circle cx="300" cy="300" r="10"/><text x="296" y="304" fill="#fff">3</text>
    <circle cx="610" cy="299" r="10"/><text x="606" y="303" fill="#fff">4</text>
  </g>
  <g font-size="12">
    <text x="640" y="70" font-weight="bold">Anotaciones</text>
    <text x="640" y="94">1 Validación local: borde grueso, mensaje</text>
    <text x="652" y="110">en texto y foco en el campo; no se envía.</text>
    <text x="640" y="134">2 503 recuperable: «Reintentar» con contador</text>
    <text x="652" y="150">visible (máx. 3, siguienteReintento()).</text>
    <text x="640" y="174">3 Salida explícita al agotar reintentos.</text>
    <text x="652" y="190">Sin conexión en apertura: «Reintentar es</text>
    <text x="652" y="206">seguro» (idempotente).</text>
    <text x="640" y="230">4 404 EXPEDIENTE_NO_ABIERTO = estado vacío</text>
    <text x="652" y="246">con acción que lleva a WF-04.</text>
  </g>
</svg>
