    <circle cx="115" cy="475" r="11" fill="#fff"/>
    <line x1="115" y1="486" x2="115" y2="522"/>
    <line x1="92" y1="498" x2="138" y2="498"/>
    <line x1="115" y1="522" x2="98" y2="552"/>
    <line x1="115" y1="522" x2="132" y2="552"/>
    <text x="115" y="578" font-size="13" font-weight="700" text-anchor="middle" stroke="none">Bioquimico</text>

    <circle cx="1090" cy="595" r="11" fill="#fff"/>
    <line x1="1090" y1="606" x2="1090" y2="642"/>
    <line x1="1067" y1="618" x2="1113" y2="618"/>
    <line x1="1090" y1="642" x2="1073" y2="672"/>
    <line x1="1090" y1="642" x2="1107" y2="672"/>
    <text x="1090" y="698" font-size="13" font-weight="700" text-anchor="middle" stroke="none">Medico solicitante</text>
