openapi: 3.0.3
info:
  title: Sistema Hospitalario Integrado — API v1
  version: 0.1.0
  description: >
    Especificación base del API bajo /api/v1. Autenticación JWT
    (Authorization: Bearer) y multitenancy por la cabecera X-Tenant-ID,
    igual que resources/js/plugins/axios.js. Los módulos agregan sus
    paths conforme sus contratos se fusionan (ASII-05 citas, ASII-27
    reportes, etc.); esta base se mantiene abierta sin editar sus
    componentes ya publicados (ISP).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
    tenantHeader: []
tags:
  - name: auth
    description: Sesiones y tokens
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Alta de usuario en el tenant con rol Recepcionista
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/login:
    post:
      tags: [auth]
      summary: Inicio de sesión
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/me:
    get:
      tags: [auth]
      summary: Usuario de la sesión actual con roles y tenant
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Invalida el token actual
      responses:
        '200': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Renueva el access token (X-Tenant-ID debe coincidir con el token)
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: bearer }
                  expires_in: { type: integer, description: segundos }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Identificador del tenant (obligatorio en todas las rutas)
  responses:
    Unauthorized:
      description: Token inválido o expirado (hoy solo message)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Tenant del token no coincide con X-Tenant-ID o permiso insuficiente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Validación fallida con detalle por campo en errors
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationFailed' }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string, nullable: true, description: pendiente del acuerdo común }
        trace_id: { type: string, nullable: true, description: pendiente del acuerdo común }
    ValidationFailed:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: Recepcionista }
        tenant:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
    Session:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, description: segundos }
        user: { $ref: '#/components/schemas/User' }
