<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="960" viewBox="0 0 1250 960"><title>Casos de uso — Captura de signos vitales, evaluación de umbrales y generación de alerta</title><defs><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#1f2a44" stroke-width="1.4"/></marker></defs><rect width="1250" height="960" fill="white"/><text x="625.0" y="30.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2a44">Casos de uso — Captura de signos vitales, evaluación de umbrales y generación de alerta</text><rect x="240" y="55" width="800" height="740" rx="6" fill="#fbfcfe" stroke="#1f2a44" stroke-width="1.6"/><text x="640.0" y="82.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2a44">Sistema Hospitalario Integrado — Módulo Signos vitales y alertas por valores anormales</text><line x1="470.6" y1="219.3" x2="609.4" y2="248.7" stroke="#1f2a44" stroke-width="1.3" fill="none" stroke-dasharray="7 5" marker-end="url(#open)"/><line x1="608.1" y1="153.7" x2="471.9" y2="181.3" stroke="#1f2a44" stroke-width="1.3" fill="none" stroke-dasharray="7 5" marker-end="url(#open)"/><line x1="850.3" y1="324.0" x2="770.2" y2="294.2" stroke="#1f2a44" stroke-width="1.3" fill="none" stroke-dasharray="7 5" marker-end="url(#open)"/><line x1="920.0" y1="384.0" x2="920.0" y2="446.0" stroke="#1f2a44" stroke-width="1.3" fill="none" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M859.6,378.2 Q770,420 730.7,544.2" stroke="#1f2a44" stroke-width="1.3" fill="none" stroke-dasharray="7 5" marker-end="url(#open)"/><line x1="456.7" y1="494.4" x2="644.0" y2="553.9" stroke="#1f2a44" stroke-width="1.3" fill="none" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M393.7,233.7 Q510,520 667.8,679.4" stroke="#1f2a44" stroke-width="1.3" fill="none" stroke-dasharra