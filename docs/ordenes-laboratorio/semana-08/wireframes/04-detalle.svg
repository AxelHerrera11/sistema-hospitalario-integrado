  <text x="44" y="212" font-family="system-ui" font-size="13" fill="#0f172a">Dra. Méndez · hoy 09:58</text>
  <text x="300" y="194" font-family="system-ui" font-size="11" fill="#64748b">Prioridad</text>
  <text x="300" y="212" font-family="system-ui" font-size="13" fill="#0f172a">Urgente</text>
  <text x="44" y="248" font-family="system-ui" font-size="11" fill="#64748b">Contexto</text>
  <text x="44" y="266" font-family="system-ui" font-size="12" fill="#334155">Dolor abdominal, descartar infección.</text>

  <text x="44" y="304" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">Pruebas</text>
  <rect x="44" y="316" width="520" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="336" font-family="system-ui" font-size="12" fill="#0f172a">GLU · Glucosa</text>
  <text x="470" y="336" font-family="system-ui" font-size="11" fill="#64748b">Química</text>
  <rect x="44" y="352" width="520" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="372" font-family="system-ui" font-size="12" fill="#0f172a">HB · Hemograma</text>
  <text x="470" y="372" font-family="system-ui" font-size="11" fill="#64748b">Hematología</text>

  <rect x="608" y="84" width="328" height="506" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="628" y="112" font-family="system-ui" font-size="13" font-weight="700" fill="#0f172a">Historial</text>
  <circle cx="642" cy="146" r="6" fill="#2563eb"/>
  <line x1="642" y1="152" x2="642" y2="208" stroke="#cbd5e1"/>
  <text x="660" y="144" font-family="system-ui" font-size="12" font-weight="600" fill="#0f172a">EN PROCESO</text>
