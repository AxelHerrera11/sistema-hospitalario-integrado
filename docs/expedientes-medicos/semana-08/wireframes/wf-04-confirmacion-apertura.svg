<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>WF-04 Confirmación y resultado de la apertura</title>
  <rect width="900" height="460" fill="#fff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">WF-04 · Confirmación de la apertura → resultado</text>
  <rect x="20" y="44" width="600" height="230" fill="#bdbdbd"/>
  <rect x="110" y="70" width="420" height="180" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="128" y="98" font-weight="bold" font-size="15">¿Abrir el expediente?</text>
  <text x="128" y="124" font-size="12">Se abrirá el expediente del paciente P-0002 en Hospital Demo.</text>
  <text x="128" y="142" font-size="12">Cada paciente tiene un solo expediente por hospital y la</text>
  <text x="128" y="160" font-size="12">apertura queda registrada en auditoría.</text>
  <rect x="128" y="196" width="110" height="32" fill="#fff" stroke="#333" stroke-width="3"/><text x="155" y="217">Cancelar</text>
  <rect x="300" y="196" width="210" height="32" fill="#555"/><text x="330" y="217" fill="#fff">Sí, abrir expediente</text>
  <rect x="20" y="290" width="600" height="130" fill="#f7f7f7" stroke="#555"/>
  <rect x="32" y="302" width="576" height="104" fill="#ececec" stroke="#555"/>
  <text x="44" y="324" font-weight="bold">Expediente abierto</text>
  <text x="44" y="344" font-size="12">Se abrió el expediente EXP-P-0002.   |   variante 200: «El paciente ya tenía el expediente…; no se creó otro.»</text>
  <rect x="44" y="360" width="160" height="30" fill="#fff" stroke="#555"/><text x="56" y="380">Consultar expediente</text>
  <g fill="#c62828" font-weight="bold" font-size="12">
    <circle cx="538" cy="98" r="10"/><text x="534" y="102" fill="#fff">1</text>
    <circle cx="246" cy="212" r="10"/><text x="242" y="216" fill="#fff">2</text>
    <circle cx="612" cy="324" r="10"/><text x="608" y="328" fill="#fff">3</text>
  </g>
  <g font-size="12">
    <text x="640" y="70" font-weight="bold">Anotaciones</text>
    <text x="640" y="94">1 Diálogo modal nativo (&lt;dialog&gt;): nombra</text>
    <text x="652" y="110">paciente, hospital y consecuencia.</text>
    <text x="640" y="134">2 Foco inicial en «Cancelar» (prevención de</text>
    <text x="652" y="150">errores); Esc cierra sin abrir.</text>
    <text x="640" y="174">3 Dos éxitos distintos: 201 creado y 200</text>
    <text x="652" y="190">«ya existía» (idempotente). Siguiente paso</text>
    <text x="652" y="206">sugerido: «Consultar expediente».</text>
    <text x="640" y="230">Errores: 404 no existe, 409 no activo,</text>
    <text x="652" y="246">403 sin permiso (hoy, por la propuesta).</text>
  </g>
</svg>
