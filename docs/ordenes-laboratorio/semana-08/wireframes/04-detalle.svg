  <circle cx="642" cy="218" r="6" fill="#60a5fa"/>
  <line x1="642" y1="224" x2="642" y2="280" stroke="#cbd5e1"/>
  <text x="660" y="216" font-family="system-ui" font-size="12" font-weight="600" fill="#0f172a">TOMADA</text>
  <text x="660" y="232" font-family="system-ui" font-size="11" fill="#64748b">Enf. Solís · hoy 10:05</text>

  <circle cx="642" cy="290" r="6" fill="#94a3b8"/>
  <text x="660" y="288" font-family="system-ui" font-size="12" font-weight="600" fill="#0f172a">EMITIDA</text>
  <text x="660" y="304" font-family="system-ui" font-size="11" fill="#64748b">Dra. Méndez · hoy 09:58</text>

