<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>WF-01 Búsqueda del expediente (estado inicial)</title>
  <rect width="900" height="520" fill="#fff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">WF-01 · Búsqueda del expediente — estado inicial (escritorio ≥ 768 px)</text>
  <rect x="20" y="40" width="600" height="40" fill="#d9d9d9" stroke="#555"/>
  <text x="32" y="65" font-weight="bold">Expediente médico</text>
  <rect x="20" y="90" width="210" height="300" fill="#f7f7f7" stroke="#555"/>
  <text x="32" y="112" font-weight="bold">Buscar expediente</text>
  <text x="32" y="136">Usuario (sesión)</text><rect x="32" y="142" width="186" height="26" fill="#fff" stroke="#777"/>
  <text x="32" y="186">Hospital</text><rect x="32" y="192" width="186" height="26" fill="#fff" stroke="#777"/>
  <text x="32" y="236">Código del paciente *</text><rect x="32" y="242" width="186" height="26" fill="#fff" stroke="#777"/>
  <text x="32" y="284" font-size="11" fill="#555">Letras, números y guion; máx. 40</text>
  <rect x="32" y="296" width="186" height="30" fill="#555"/><text x="60" y="316" fill="#fff">Consultar expediente</text>
  <rect x="32" y="334" width="186" height="30" fill="#fff" stroke="#555"/><text x="62" y="354">Abrir expediente…</text>
  <rect x="240" y="90" width="380" height="300" fill="#f7f7f7" stroke="#555"/>
  <text x="252" y="112" font-weight="bold">Resultado</text>
  <rect x="252" y="124" width="356" height="44" fill="#e6e6e6" stroke="#999" stroke-dasharray="4 3"/>
  <text x="262" y="150">Escriba un código de paciente y elija «Consultar».</text>
  <g fill="#c62828" font-weight="bold" font-size="12">
    <circle cx="226" cy="155" r="10"/><text x="222" y="159" fill="#fff">1</text>
    <circle cx="226" cy="255" r="10"/><text x="222" y="259" fill="#fff">2</text>
    <circle cx="226" cy="311" r="10"/><text x="222" y="315" fill="#fff">3</text>
    <circle cx="226" cy="349" r="10"/><text x="222" y="353" fill="#fff">4</text>
    <circle cx="616" cy="146" r="10"/><text x="612" y="150" fill="#fff">5</text>
  </g>
  <g font-size="12">
    <text x="640" y="110" font-weight="bold">Anotaciones</text>
    <text x="640" y="134">1 Identidad y hospital vienen de la sesión;</text>
    <text x="652" y="150">cambiarlos limpia los datos en pantalla.</text>
    <text x="640" y="174">2 Validación local del formato antes de</text>
    <text x="652" y="190">enviar; error bajo el campo (aria-invalid).</text>
    <text x="640" y="214">3 Acción principal; Enter también consulta.</text>
    <text x="640" y="238">4 Acción secundaria: siempre pide</text>
    <text x="652" y="254">confirmación (WF-04).</text>
    <text x="640" y="278">5 Estado inicial con ayuda contextual;</text>
    <text x="652" y="294">región aria-live para los resultados.</text>
  </g>
  <text x="20" y="420" font-size="12" fill="#555">Regla: la interfaz no decide permisos; solo valida formato. Implementado en public/ui/index.html y app.js.</text>
</svg>
