a, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">Jefatura de</text> <text x="115" y="585.4000000000001" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">servicio / médico</text> <text x="115" y="600.4000000000001" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">de guardia</text> <rect x="1069" y="133.6" width="132" height="81" rx="6" fill="#f4f5f8" stroke="#1f2a44" stroke-width="1.4"/> <text x="1135" y="151.6" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#5b6478">«sistema»</text> <text x="1135" y="169.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">Validación de</text> <text x="1135" y="184.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">resultados</text> <text x="1135" y="199.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">(ASII-19/20)</text> <rect x="1069" y="240.0" width="132" height="66" rx="6" fill="#f4f5f8" stroke="#1f2a44" stroke-width="1.4"/> <text x="1135" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#5b6478">«sistema»</text> <text x="1135" y="276.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">Catálogo de</text> <text x="1135" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">pruebas (ASII-17)</text> <rect x="1069" y="363.20000000000005" width="132" height="66" rx="6" fill="#f4f5f8" stroke="#1f2a44" stroke-width="1.4"/> <text x="1135" y="381.20000000000005" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#5b6478">«sistema»</text> <text x="1135" y="399.20000000000005" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">Planificador</text> <text x="1135" y="414.20000000000005" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">(alerts:escalate)</text> <rect x="1069" y="486.4000000000001" width="132" height="66" rx="6" fill="#f4f5f8" stroke="#1f2a44" stroke-width="1.4"/> <text x="1135" y="504.4000000000001" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#5b6478">«sistema»</text> <text x="1135" y="522.4000000000001" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">RBAC / JWT</text> <text x="1135" y="537.4000000000001" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">(ASII-01/02)</text> <rect x="1069" y="609.5999999999999" width="132" height="81" rx="6" fill="#f4f5f8" stroke="#1f2a44" stroke-width="1.4"/> <text x="1135" y="627.5999999999999" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#5b6478">«sistema»</text> <text x="1135" y="645.5999999999999" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">Bitácora de</text> <text x="1135" y="660.5999999999999" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">auditoría</text> <text x="1135" y="675.5999999999999" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">(HOSPITAL)</text> <text x="245" y="768" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">Línea continua: asociación actor–caso de uso.  <tspan fill="#2e7d32">«include»</tspan>: comportamiento obligatorio reutilizado.  <tspan fill="#b26a00">«extend»</tspan>: comportamiento condicional sobre el caso base.</text> <text x="245" y="788" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">UC-ALR-02 extiende a UC-ALR-01 solo si el valor cae fuera de los umbrales críticos de la versión de la prueba y aún no existe una alerta para ese resultado (idempotencia).</text> <text x="245" y="806" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">UC-ALR-05 lo dispara el planificador: si vence el plazo sin acuse, sube un nivel (médico tratante → jefatura de servicio → dirección médica) y vuelve a notificar (UC-ALR-03).</text> <text x="245" y="824" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">Fuente de esta semana: resultados de laboratorio. Signos vitales (ASII-13) podría ser otra fuente con el mismo contrato (coordinación C1).</text> </svg>
