    <text x="445" y="510" font-size="13" text-anchor="middle" stroke="none">Corregir resultado</text>

    <ellipse cx="700" cy="500" rx="125" ry="35" fill="#eef3fb"/>
    <text x="700" y="490" font-size="12" font-weight="700" text-anchor="middle" fill="#2b4c7e" stroke="none">UC-LAB-06</text>
    <text x="700" y="510" font-size="13" text-anchor="middle" stroke="none">Versionar y auditar</text>

    <ellipse cx="700" cy="610" rx="125" ry="35" fill="#eef3fb"/>
