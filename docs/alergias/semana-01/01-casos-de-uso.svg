<text x="1135" y="681.1999999999999" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a44">(HOSPITAL)</text>
<text x="245" y="768" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">Línea continua: asociación actor–caso de uso.  <tspan fill="#2e7d32">«include»</tspan>: comportamiento obligatorio reutilizado.  <tspan fill="#b26a00">«extend»</tspan>: comportamiento condicional sobre el caso base.</text>
<text x="245" y="788" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">UC-ALG-03 extiende a UC-ALG-01 cuando ya existe una alergia activa equivalente (allergies_active_equivalent_unique) o faltan datos obligatorios.</text>
<text x="245" y="806" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">UC-ALG-05 es falla segura: si las alergias no se pueden leer, la alerta dice «Alergias no disponibles», nunca «Sin alergias».</text>
<text x="245" y="824" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">UC-ALG-09 es el contrato de solo lectura (AllergyChecker) que consume Prescripciones; usa la misma consulta de alergias activas que UC-ALG-05.</text>
</svg>
