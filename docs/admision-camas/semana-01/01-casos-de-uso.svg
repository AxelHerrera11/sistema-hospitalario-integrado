<text x="245" y="656" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">Línea continua: asociación actor–caso de uso.  <tspan fill="#2e7d32">«include»</tspan>: comportamiento obligatorio reutilizado.  <tspan fill="#b26a00">«extend»</tspan>: comportamiento condicional sobre el caso base.</text>
<text x="245" y="676" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">UC-ADM-05 extiende a UC-ADM-04 si la cama no está disponible, la sala está inactiva, el episodio ya tiene cama o la exclusión GiST de bed_stays detecta otra asignación simultánea.</text>
<text x="245" y="694" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">UC-ADM-09 extiende a UC-ADM-03 cuando no hay camas disponibles: el episodio inpatient queda abierto sin bed_stay hasta que se asigne una.</text>
<text x="245" y="712" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6478">La liberación de camas, los traslados y las altas pertenecen a ASII-08; el tablero de ocupación, a ASII-09.</text>
</svg>
