y="7 5" marker-end="url(#open)"/><line x1="473.1" y1="658.9" x2="606.9" y2="686.1" stroke="#1f2a44" stroke-width="1.3" fill="none" stroke-dasharray="7 5" marker-end="url(#open)"/><ellipse cx="380" cy="230" rx="110" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="380.0" y="218.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-01</text><text x="380.0" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Registrar signos vitales</text><text x="380.0" y="251.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">del paciente</text><ellipse cx="380" cy="640" rx="112" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="380.0" y="628.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-08</text><text x="380.0" y="645.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Consultar signos vitales</text><text x="380.0" y="661.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">y su evaluación</text><ellipse cx="700" cy="135" rx="110" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="700.0" y="123.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-03</text><text x="700.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Rechazar medición</text><text x="700.0" y="156.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">no plausible</text><ellipse cx="700" cy="285" rx="110" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="700.0" y="273.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-02</text><text x="700.0" y="290.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Evaluar umbrales</text><text x="700.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">clínicos</text><ellipse cx="920" cy="380" rx="108" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="920.0" y="368.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-04</text><text x="920.0" y="385.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Generar alerta</text><text x="920.0" y="401.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">clínica</text><ellipse cx="920" cy="520" rx="108" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="920.0" y="508.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-05</text><text x="920.0" y="525.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Notificar alerta a</text><text x="920.0" y="541.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">médicos tratantes</text><ellipse cx="705" cy="592" rx="108" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="705.0" y="580.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-07</text><text x="705.0" y="597.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Registrar evento</text><text x="705.0" y="613.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">de auditoría</text><ellipse cx="700" cy="705" rx="112" ry="34" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5"/><text x="700.0" y="693.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b4c7e">UC-SV-06</text><text x="700.0" y="710.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">Validar acceso y</text><text x="700.0" y="726.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2a44">médico tratante</text><line x1="142.0" y1="440.0" x2="343.6" y2="262.1" stroke="#1f2a44" stroke-width="1.3" fill="none"/><line x1="142.0" y1="440.0" x2="341.9" y2="608.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><circle cx="110" cy="400" r="11" fill="white" stroke="#1f2a44" stroke-width="1.6"/><line x1="110" y1="411" x2="110" y2="444" stroke="#1f2a44" stroke-width="1.6"/><line x1="90" y1="422" x2="130" y2="422" stroke="#1f2a44" stroke-width="1.6"/><line x1="110" y1="444" x2="95" y2="468" stroke="#1f2a44" stroke-width="1.6"/><line x1="110" y1="444" x2="125" y2="468" stroke="#1f2a44" stroke-width="1.6"/><text x="110.0" y="490.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2a44">Médico tratante</text><text x="110.0" y="506.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2a44">(asignación activa)</text><line x1="489.4" y1="226.6" x2="1053" y2="209.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><rect x="1055" y="180" width="170" height="58" fill="#f6f6f6" stroke="#1f2a44" stroke-width="1.4"/><text x="1140.0" y="201.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1140.0" y="214.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">Expediente médico</text><text x="1140.0" y="229.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">(episodio y expediente)</text><line x1="810.0" y1="285.0" x2="1053" y2="285.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><rect x="1055" y="256" width="170" height="58" fill="#f6f6f6" stroke="#1f2a44" stroke-width="1.4"/><text x="1140.0" y="277.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1140.0" y="290.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">Perfil de umbrales</text><text x="1140.0" y="305.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">(configuración versionada)</text><line x1="1028.0" y1="520.0" x2="1053" y2="520.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><rect x="1055" y="491" width="170" height="58" fill="#f6f6f6" stroke="#1f2a44" stroke-width="1.4"/><text x="1140.0" y="512.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1140.0" y="525.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">Servicio de</text><text x="1140.0" y="540.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">notificaciones</text><line x1="809.9" y1="600.1" x2="1053" y2="619.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><rect x="1055" y="590" width="170" height="58" fill="#f6f6f6" stroke="#1f2a44" stroke-width="1.4"/><text x="1140.0" y="611.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1140.0" y="624.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">Bitácora de</text><text x="1140.0" y="639.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">auditoría</text><line x1="809.3" y1="712.4" x2="1053" y2="729.0" stroke="#1f2a44" stroke-width="1.3" fill="none"/><rect x="1055" y="700" width="170" height="58" fill="#f6f6f6" stroke="#1f2a44" stroke-width="1.4"/><text x="1140.0" y="721.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«sistema»</text><text x="1140.0" y="734.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">RBAC</text><text x="1140.0" y="749.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f2a44">(roles y permisos)</text><path d="M240,812 L1028,812 L1040,824 L1040,940 L240,940 Z" fill="#fff8d6" stroke="#8a7a2a" stroke-width="1.1"/><text x="250.0" y="832.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Regla: solo un médico con care_assignment activo en el episodio registra signos vitales (trigger de autoría de vital_signs).</text><text x="250.0" y="853.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Rangos de plausibilidad (CHECK de vital_signs) ≠ umbrales clínicos: lo imposible se rechaza; lo anormal se guarda y genera alerta.</text><text x="250.0" y="874.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">La alerta no es una tabla: se deriva del signo vital y del perfil de umbrales; signo y auditoría van en una sola transacción.</text><text x="250.0" y="895.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">La notificación es asíncrona tras el COMMIT y se reintenta. Reconocer alertas queda pendiente de acordar critical_alert con laboratorio.</text><text x="250.0" y="916.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2a44">Fuera de alcance: captura por enfermería o dispositivos, reconocimiento y escalamiento de alertas, SMS/correo y umbrales pediátricos.</text><rect x="508.6" y="240.5" width="62.9" height="17" fill="white" opacity="0.92"/><text x="540.0" y="253.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="398.4" y="155.5" width="203.2" height="17" fill="white" opacity="0.92"/><text x="500.0" y="168.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«extend» [medición no plausible]</text><rect x="788.6" y="317.6" width="203.2" height="17" fill="white" opacity="0.92"/><text x="890.2" y="330.6" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«extend» [valor fuera de umbral]</text><rect x="924.5" y="437.0" width="62.9" height="17" fill="white" opacity="0.92"/><text x="956.0" y="450.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="711.0" y="435.1" width="62.9" height="17" fill="white" opacity="0.92"/><text x="742.4" y="448.1" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="781.0" y="559.0" width="62.9" height="17" fill="white" opacity="0.92"/><text x="812.5" y="572.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="416.9" y="480.6" width="62.9" height="17" fill="white" opacity="0.92"/><text x="448.3" y="493.6" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text><rect x="508.6" y="649.5" width="62.9" height="17" fill="white" opacity="0.92"/><text x="540.0" y="662.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2a44" font-style="italic">«include»</text></svg>